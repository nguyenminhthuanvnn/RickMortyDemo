name: Continuous Distribution

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  distribute:
    name: Distribute Staging APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Important for 'last_git_commit_message' in Fastlane

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
          bundler-cache: true

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      - name: Distribute to Firebase
        run: bundle exec fastlane android distribute_staging
        env:
          FIREBASE_APP_ID: ${{ secrets.FIREBASE_APP_ID }}
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}

      - name: Slack Notification
        if: success()
        run: echo "Successfully distributed new build to Firebase!"
        # In a real project, you would use a Slack action here:
        # uses: 8398a7/action-slack@v3
        # with:
        #   status: ${{ job.status }}
        #   fields: repo,message,commit,author,action,eventName,ref,workflow
        # env:
        #   SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
