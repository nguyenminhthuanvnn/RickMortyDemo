name: Continuous Distribution

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:
    inputs:
      notes:
        default: "Default note"
        description: "What's new"
jobs:
  distribute:
    name: Distribute Staging APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Important for 'last_git_commit_message' in Fastlane

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
          bundler-cache: true # caches gems based on Gemfile.lock

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      - name: Decode Firebase service account credentials
        env:
           FIREBASE_SERVICE_ACCOUNT_B64: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_B64 }}
        run: |
          echo "$FIREBASE_SERVICE_ACCOUNT_B64" | base64 --decode > firebase-service-account.json

      - name: Decode release keystore
        env:
          ANDROID_KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
        run: |
          echo "$ANDROID_KEYSTORE_B64" | base64 --decode > release.keystore.jks

      - name: Distribute to Firebase
        env:
          FIREBASE_APP_ID: ${{ secrets.FIREBASE_APP_ID }}
          FIREBASE_CREDENTIALS_PATH: ${{ github.workspace }}/firebase-service-account.json
          FIREBASE_DISTRIBUTION_GROUPS: ${{ vars.FIREBASE_DISTRIBUTION_GROUPS }}  # e.g. "testers"
          ANDROID_PACKAGE_NAME: ${{ vars.ANDROID_PACKAGE_NAME }}
          RELEASE_NOTES: "Build ${{ github.run_number }} - ${{ github.sha }}"
          ANDROID_KEYSTORE_PATH: ${{ github.workspace }}/release.keystore.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          VERSION_CODE: ${{ github.run_number }}
          VERSION_NAME: "1.0.${{ github.run_number }}"
        run: bundle exec fastlane android distribute_staging

      - name: Clean up credentials files
        if: always()
        run: |
          rm -f firebase-service-account.json
          rm -f release.keystore.jks

      - name: Slack Notification
        if: success()
        run: echo "Successfully distributed new build to Firebase!"
        # In a real project, you would use a Slack action here:
        # uses: 8398a7/action-slack@v3
        # with:
        #   status: ${{ job.status }}
        #   fields: repo,message,commit,author,action,eventName,ref,workflow
        # env:
        #   SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
